<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Naive loop versus shared computation</title>
<desc>Comparison diagram: on the left, checking eligibility for every opening in an opportunity by looping calls checkEligibility, redoing the volunteer's qualification, waiver, and group checks once per opening. On the right, a bulk check computes those same shared checks once, then only runs the per-opening status, capacity, and conflict checks for each opening.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="170" y="26" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Naive loop</text>
<text x="510" y="26" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Shared computation</text>

<g>
<rect x="50" y="46" width="240" height="44" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<text x="170" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">checkEligibility()</text>
</g>
<line x1="170" y1="90" x2="170" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="136" width="240" height="56" rx="8" stroke-width="0.5" stroke="#993C1D" fill="#F5C4B3"/>
<rect x="53" y="133" width="240" height="56" rx="8" stroke-width="0.5" stroke="#993C1D" fill="#F5C4B3"/>
<g>
<rect x="50" y="130" width="240" height="56" rx="8" stroke-width="0.5" stroke="#993C1D" fill="#F5C4B3"/>
<text x="170" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Quals + waiver + group</text>
<text x="170" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">redone every opening</text>
</g>
<line x1="170" y1="202" x2="170" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="50" y="240" width="240" height="56" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<text x="170" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Per-opening checks</text>
<text x="170" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">status, capacity, conflict</text>
</g>

<g>
<rect x="390" y="46" width="240" height="44" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<text x="510" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Bulk eligibility check</text>
</g>
<line x1="510" y1="90" x2="510" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="390" y="126" width="240" height="56" rx="8" stroke-width="0.5" stroke="#0F6E56" fill="#9FE1CB"/>
<text x="510" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Quals + waiver + group</text>
<text x="510" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">computed once</text>
</g>
<line x1="510" y1="192" x2="510" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="396" y="238" width="240" height="56" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<rect x="393" y="235" width="240" height="56" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<g>
<rect x="390" y="232" width="240" height="56" rx="8" stroke-width="0.5" stroke="#B4B2A9" fill="#F1EFE8"/>
<text x="510" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Per-opening checks</text>
<text x="510" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">status, capacity, conflict</text>
</g>

<rect x="143" y="330" width="14" height="14" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="163" y="337" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Redundant repeat</text>
<rect x="323" y="330" width="14" height="14" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="343" y="337" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Computed once</text>
<rect x="493" y="330" width="14" height="14" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="513" y="337" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Per-opening work</text>
</svg>
